name: Android CI

on:
  push:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and launch APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --no-daemon
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Install and launch release APK in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          script: |
            adb install app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n app.flux.downloader/.MainActivity
            sleep 10
            if ! adb shell pidof app.flux.downloader; then
              adb logcat -d -v time
              exit 1
            fi

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flux-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
